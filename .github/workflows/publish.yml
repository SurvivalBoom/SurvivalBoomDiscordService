name: Publish

on:
  push:
    tags:
      - 'v*'   # Публикает короче когда ток создается тег, начинающийся с "v"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Set up Maven authentication
        run: |
          echo "Publishing to GitHub Packages"
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API module
        run: ./gradlew :api:build

      - name: Publish API module
        run: ./gradlew :api:publish
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
