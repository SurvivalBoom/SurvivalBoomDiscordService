$name: "russian"
$displayName: "$[lang.russian]"
$icon: "🇷🇺"
$locale: RUSSIAN

lang:
  ukrainian: "Украинский"
  russian: "Русский"
  english: "Английский"

values:
  true: "Да"
  false: "Нет"
  none: "Нету"

sbds:

  config:
    label: "Параметры ядра"
    prefix: "Префикс команд"
    translation: "Перевод сервера"
    timezone: "Часовой пояс"

  command:

    status:
      description: "Отображает статус дискорд бота."

  loading:
    $embed:
      description: ":pencil: Обрабатываем ваш запрос, секундочку..."
      color: f9f06b

  error:
    $embed:
      title: ":bangbang: Ой-ой! :bangbang:"
      color: ff0000
      description: |
        Произошла неизвестная ошибка при попытке обработать ваш запрос!
        Информацию про ошибку отправлено в консоль. Попробуйте позже или свяжитесь с разработчиком.
      fields:
        - name: "Ошибка:"
          value: "{exception}"

  interaction-no-response:
    title: "Повисла мертвая тишина"
    color: ff0000
    description: |
      Похоже, ответ на это взаимодействие не был получен...
      Возможно, что-то пошло не так, или же SBDS не желает с вами разговаривать. 
      Информация об ошибке отправлена в консоль. Попробуйте еще раз позже или свяжитесь с разработчиком.

  no-permission:
    $embed:
      title: "У вас нету доступа!"
      color: ff0000
      description: |
        Ой-ой! Похоже, что у вас недостаточно прав для использования этого.
        Попробуйте обратиться к администрации, если вы думаете что это ошибка.
        Необходимое разрешение: `{permission}`.

  invalid-interaction:
    $embed:
      title: "Неправильное взаимодействие!"
      color: ff0000
      description: |
        Ой-ой! Похоже, этого взаимодействия не существует.
        Может быть это взаимодействие больше недоступно или вы пытаетесь сделать невозможное.
        Попробуйте вызвать команду еще раз или обратитесь к разработчику, если вы думаете что это ошибка.
      footer: "Interaction id: {id}"

  slash-invalid-argument:
    $embed:
      title: "Неправильный аргумен!"
      color: ff0000
      description: |
        Неправильный аргумент `{argument}`. Похоже, вы где-то ошиблись.
        `{message}`
        
  string-argument-invalid:
    $embed:
      title: "Неверный аргумент!"
      color: ff0000
      description: |
        Вы указали неверное значение аргумента.
        Пожалуйста, проверьте указанное вами значение на правильность.
      fields:

        - name: Аргумент
          value: "`{argument}`"
          inline: true

        - name: Указанное значение
          value: "`{input}`"
          inline: true

        - name: Ошибка
          value: "`{message}`"
          inline: true

  string-argument-error:
    $embed:
      title: Ошибка аргумента :(
      color: ff0000
      description: |
        Упсь! Похоже, аргумент неожиданно выдал ошибку при попытке обработать указанное вам значние.
        Скорее всего это ошибка разработчика. Лог ошибки отправлен в консолью Свяжитесь с разработчиком либо повторите попытку чуть позже...
      fields:

        - name: Аргумент
          value: "`{argument}`"
          inline: true

        - name: Указанное значение
          value: "`{input}`"
          inline: true

        - name: Ошибка
          value: "`{exception}`"
          inline: true

  string-not-enough-arguments:
    $embed:
      title: Неполная команда
      color: ff0000
      description: |
        Эта команда имеет **{expected}** аргументов. Вы указали **{got}**.
        Использование: `{usage}`