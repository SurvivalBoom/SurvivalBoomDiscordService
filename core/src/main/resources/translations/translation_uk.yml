$name: "ukrainian"
$displayName: "$[lang.ukrainian]"
$icon: "🇺🇦"
$locale: UKRAINIAN

lang:
  ukrainian: "🇺🇦 Українська"
  russian: "🐷 Свинособача"
  english: "🇺🇸 Англійська"

values:
  true: "Так"
  false: "Ні"
  none: "Немає"

sbds:

  config:
    label: "Налаштування ядра"
    prefix: "Префікс команд"
    translation: "Переклад серверу"
    timezone: "Часовий пояс"

  command:

    status:
      description: "Відображає статус діскорд бота."

  loading:
    $embed:
      description: ":pencil: Оброблюємо ваш запит, зачекайте..."
      color: f9f06b

  error:
    $embed:
      title: ":bangbang: Ой-ой! :bangbang:"
      color: ff0000
      description: |
        Сталась невідома помилка у SBDS при спробі обробити ваш запит!
        Інформацію про помилку надіслано у консоль. Спробуйте ще раз пізніше або зв'яжіться з розробником.
      fields:
        - name: "Помилка:"
          value: "{exception}"

  interaction-no-response:
    $embed:
      title: "Запала мертва тиша"
      color: ff0000
      description: |
        Схоже, що відповідь на цю взаємодію не було отримано...
        Можливо, десь щось пішло не так, або ж SBDS не бажає із вами розмовляти. 
        Інформацію про помилку надіслано у консоль. Спробуйте ще раз пізніше або зв'яжіться з розробником.

  no-permission:
    $embed:
      title: "У вас немає доступу!"
      color: ff0000
      description: |
        Отакої! Схоже, що вам бракує дозволів для цього!
        Спробуйте звернутись до адміністратора, якщо ви думаєте що це помилка.
        Необхідний дозвіл: `{permission}`.

  invalid-interaction:
    $embed:
      title: "Невірна взаємодія!"
      color: ff0000
      description: |
        Отакої! Схоже, що цієї взаємодії не існує!
        Можливо ця дія прострочилась або ви намагаєтесь зробити щось неможливе.
        Спробуйте виконати команду ще раз або зверніться до розробника, якщо ви думаєте що це помилка.
      footer: "Interaction id: {id}"

  slash-invalid-argument:
    $embed:
      title: "Невірний аргумент!"
      color: ff0000
      description: |
        Невірний аргумент `{argument}`. Схоже, ви десь припустились помилки.
        `{message}`

  string-argument-invalid:
    $embed:
      title: "Невірний аргумент!"
      color: ff0000
      description: |
        Ви вказали невірне значення аргументу. 
        Будь ласка, перевірте вказане вами значення на правильність.
      fields:

        - name: Аргумент
          value: "`{argument}`"
          inline: true

        - name: Вказане значення
          value: "`{input}`"
          inline: true

        - name: Помилка
          value: "`{message}`"
          inline: true

  string-argument-error:
    $embed:
      title: "Помилка аргументу :("
      color: ff0000
      description: |
        Йойки! Схоже, що аргумент несподівано видав помилку при спробі обробити вказане вами значення.
        Скоріш за все це помилка розробника. Повідомлення про помилку надіслано у консоль. Зв'яжіться із розробником або ж спробуйте трішки пізніше...
      fields:

        - name: Аргумент
          value: "`{argument}`"
          inline: true

        - name: Вказане значення
          value: "`{input}`"
          inline: true

        - name: Помилка
          value: "`{exception}`"
          inline: true

  string-not-enough-arguments:
    $embed:
      title: "Неповна команда"
      color: ff0000
      description: |
        Ця команда вимагає **{expected}** кількість аргументів. Ви вказали **{got}**.
        Використання: `{usage}`