main: "net.survivalboom.sbds.modules.music.MusicModule"

name: "MusicModule"
description: "Музичний модуль для SBDS. Музика!"
version: "${version}"

authors: TIMURishche
website: "https://survivalboom.net"

libraries:

  # lavalink-client підтягує стару версію okhttp, що конфліктує з версією, що використовується в JDA.
  relocations:
    - "com.squareup.okhttp3:okhttp:4.10.0 -> com.squareup.okhttp3:okhttp-jvm:5.3.2"

  dependencies:
    - "dev.arbjerg:lavalink-client:3.4.0"
