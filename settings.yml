  # Налаштування модуля прив'язки акаунтів майнкрафт серверу до дискорд серверу.
  # Цей модуль відповідає за видачу ролей на дискорд сервері та видачу привілегії бустер на майнкрафт сервері.
  linking-module:

    # Порт на якому буде працювати вебсервер модуля.
    # Linking module приймає http запити на генерацію коду, отримання інформації про користувача та інших дій.
    linking-web-server-port: 25746

    # Discord Service підключається до бази даних LuckPerms, щоб отримати інформацію про привілегії гравця.
    # Тут ви повинні вказати дані від бази даних LuckPerms.
    luckperms-database:

      host: "" # Посилання на базу даних.
      port: 3306 # Порт на якій працює база даних.
      database: "" # Назва бази даних LuckPerms
      user: "" # Користувач бази даних.
      password: "" # Пароль від користувача.

      lp-users-table-name: "luckperms_players" # Назва таблиці із зареєстрованими гравцями LuckPerms.
      lp-permissions-table-name: "luckperms_user_permissions" # Назва таблиці із пермішонами гравців LuckPerms.

    # Функція видачі (і забирання) ролей донатерів.
    sync-groups-to-roles:

      enabled: true # Увімкнено?

      sync-task-interval: 10 # Інтервал спрацювання події перевірки й видачі донатерських ролей.

      # Список із групами (привілегіями) на майнкрафт сервері та ID відповідних ним ролей.
      groups-list:

        - group-name: iron
          role-id: 1072468735996203108

        - group-name: gold
          role-id: 1072467986536988713

        - group-name: platinum
          role-id: 1072466910702206976

        - group-name: raptor
          role-id: 1072465984297910344

    # Функція видачі привілегії бустер на майнкрафт сервері.
    sync-booster:

      enabled: true # Увімкнено?

      sync-task-interval: 10 # Інтервал спрацювання події перевірки й видачі групи бустера (У секундах).

      # RCON підключення це таке підключення до вашого майнкрафт серверу яке дозволяє виконувати команди на сервері віддалено.
      # Щоб Discord Service міг видати гравцю привілігію або забрати, Discord Service виконує команду на сервері за допомогою RCON.
      # Увімкніть RCON у налаштуваннях сервера й впишіть дані нижче ввід RCON вашого сервера.
      rcon-connection:
        host: "" # IP або домен вашого сервера.
        port: 25588 # Порт вашого сервера який приймає RCON.
        password: "" # Пароль від вашого RCON підключення.

      # Список команд які будуть виконані через RCON на майнкрафт сервері для видачі групи (привілегії) "бустер"
      # Плейсхолдери: {PLAYER} - нік гравця.
      give-booster-group-command:
       - "lp user {PLAYER} parent addtemp booster 1w"

      # Список команд які будуть виконані через RCON на майнкрафт сервері, щоб забрати групу (привілегію) "бустер".
      # Плейсхолдери: {PLAYER} - нік гравця.
      revoke-booster-group-command:
       - "lp user {PLAYER} parent removetemp booster"
       - "lp user {PLAYER} parent remove booster"

      booster-group-name: booster # Назва групи (привілегії) бустера на майнкрафт серверу.

    # Функція видачі (і забирання) ролі прив'язаного учасника. Роль буде видаватись користувачам які прив'язали свій акаунт.
    sync-linked-role:

      enabled: true # Увімкнено?

      sync-task-interval: 10 # Інтервал спрацювання події перевірки й видачі ролі.

      linked-role-id: 1102544868246573097 # ID ролі прив'язаного учасника.

    # Функція зміни нікнейма учасника на майнкрафт нікнейм.
    sync-nickname:

      enabled: true

      sync-task-interval: 10

      nickname-format: "{{DISCORD_NICKNAME}} ({{MINECRAFT_NICKNAME}})"

