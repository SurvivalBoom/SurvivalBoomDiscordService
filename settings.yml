    # Дії при бусті дискорд сервера учасником.
    member-boost:

      # Повідомлення яке буде відправлене учаснику в особисті повідомлення.
      # Щоб не було спаму, особисте повідомлення про буст сервера буде відправлене учаснику тільки якщо він не має ролі бустера.
      dm-message:
        title: "Дякуємо за буст!" # Заголовок повідомлення
        # Текст embed повідомлення.
        description: ":heartbeat: Дякуємо вам, {{USER-MENTION}} за буст нашого серверу! 
          \n<a:Evolving_badge_Nitro_a_scaling:1081978177825546251> Ми дуже вдячні вам, а тому ви можете **прив'язати свій акаунт** щоб отримати привілегію **бустер** на нашому сервері! 
          \n
          \n:track_next: Напишіть команду `/link` на **дискорд** сервері щоб прив'язати акаунт.
          \n:arrows_counterclockwise: Привілегія буде автоматично видана впродовж 5-10хв після прив'язки.
          
