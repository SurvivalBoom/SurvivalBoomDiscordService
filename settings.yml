      start:
        title: ":video_game: Почати грати!"
        description: ":bookmark_tabs: SurvivalBoom працює на **Bedrock** і **Java** версіях майнкрафту. \n\n :computer: **Java:** комп'ютерная версія майнкрафт. \n Можна зайти з **1.16.5** по **1.20.1**. \n Рекомендуємо завжди грати з останніх версій. \n\n :mobile_phone: **Bedrock:** будь-яка інша платформа. \n Можна зайти тільки з останньої версії Minecraft Bedrock."
        color: 0x41983
        fields:

          - title: "Адреса Java версії"
            value: "`mc.survivalboom.net`"
            inline: true

          - title: "Адреса Bedrock версії"
            value: "`pe.survivalboom.net` \n Порт: `25523`"
            inline: true

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      rules:
        title: ":scroll: Правила"
        description: ":t_rex: Дотримуйся правил, інакше станеш ще одною жертвою динозаврика \n\n**Загальні правила**
          \n1.1 Будьте адекватними людьми (або динозаврами) з якими приємно спілкуватись. А саме: 
          \n- Не розводьте будь-які срачі 
          \n- Не ображайте інших учасників.
          \n- Поводьте себе нормально у голосових каналах. Налаштуйте правильно свій мікрофон, приготуйтесь до спілкування. Не видавайте неприємних звуків, сопіння, ригання, і подібне.
          \n1.2 Не поширюйте будь-який російський контент/меми/ютуберів/відомих особистостей.
          \n1.3 Не відправляйте крінж, шкідливі посилання на віруси/скрімери/фішинги й інше сміття інтернету у чат.
          \n1.4 Не встановлюйте нікнейми із матами, нецензурщиною, який неможливо/соромно читати, та будь чим що порушує інші правила.
          \n1.5 Не спамте. Спам не допоможе вам звернути увагу адміністрації, навіть навпаки.
          \n1.6 Не видавайте себе за адміністрацію. Це стосується також змінення аватарки/банеру/нікнейму на схожий до адміністрції.
          \n1.7 Не обходьте будь-які покарання, бо адміністрація може розізлитись і заблокувати вас назавжди. (Або вас згризе тиранозавр)
          \n
          \n**Правила майнкрафт серверу**
          \n2.1 Не створюйте лаги та просадки TPS серверу.
          \n2.2 Не використовуйте будь-які баги у свою користь. Краще, сповістіть адміністрацію та отримайте нагороду!
          \n2.3 Не використовуйте будь-які чіти та моди які можна назвати чітами.
          \n2.5 Ви маєте право на реєстрування і використання 3-ох акаунтів.
          \n
          \n**Правила режиму виживання**
          \n3.1 Не псуйте світ випадковими блоками/стовпами/ямами/дірками/недорубані дерева та іншим що порушує правила.
          \n3.2 Не заважайте іншим гравцям грати. Приклад: Ходити біля гравця заважаючи йому щось робити.
          \n3.3 Не гріферіть. До цього правила відноситься усе що зв'язано із крадіжкою русурсів, вбивством гравців, псування майна гравців.
          \n
          \n**Правила режиму OneBlock**
          \n4.1 Не гріферіть. До цього правила відноситься усе що зв'язано із крадіжкою русерсів, вбивством гравців, псування майна гравців. 
          
          \n**Правила донатних послуг SurvivalBoom**
          \n- Не використовуйте свої донатні можливості, щоб тролити/бісити/заважати іншим гравцям.
          \n- Навіть не намагайтесь обійти систему та отримати донатну послугу за допомогою багу.
          \n- Ми не повертаємо гроші за будь-які послуги (донат) якщо куплена вами послуга не сподобалась вам або адміністратор забокував вас за взловживання донатом.
          \n- Донатні послуги це у першу чергу спосіб підтримати розвиток серверу, і спосіб не дати нашому серверу обінкротитись.
          \n
          \nПравила написані тільки для того щоб ви випадково не зловили бан. Ми можемо вас забанити просто так і назавжди якщо це буде потрібно.
          \nSurvivalBoom є власністю адміністрації. Адміністрація серверу може робити щозавгодно на своєму сервері без дозволу гравців серверу.
          \n
          \n***Незнання правил не захищає вас від зубів тиранозавра!***
          \n**Приємної гри на SurvivalBoom!**"
        color: 0x41983
        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      navigator:
        title: ":compass: Навігатор по каналам дискорд серверу."
        description: "## Важливе
          \n <#983845556902322188> усі важливі новини SurvivalBoom Network.
          \n <#1082641762885058620> тут ви можете проголосувати у різних голосуваннях які ми будемо проводити.
          \n <#1039629227949047840> блог розробки SurvivalBoom. Тут ви можете побачити список усіх змін і оновлень.
          \n <#1033692244944891955> контент по SurvivalBoom від нас і наших контент мейкерів.
          \n <#1087370237629976687> моніторинг усіх систем SurvivalBoom Network. Якщо ви не можете зайти, перевірте статус систем SurvivalBoom.
          \n <#1154287424772509696> плани майбутніх оновлень SurvivalBoom.
          \n## Зв'язок з адміністрацією
          \n <#1077260676768206888> скарги на гравців. Тут ви можете подати скаргу на гравця за порушення правил.
          \n <#1077243862667509790> канал із багами і проблемами нашого серверу. Тут ви можете повідомити нас про баг або проблему на майнкарфт сервері або у іншому місці.
          \n <#1076925156175400980> канал із пропозиціями. Тут ви можете запропонувати нам свою ідею для майбутніх оновлень SurvivalBoom або запропонувати щось змінити.
          \n <#1077244219271421972> відповіді на ваші запитання. Тут ви можете задати питання по нашому серверу щоб адміністрація відповіла вам на ваше питання.
          \n <#1082022609052508291> набір на різні посади. Ви можете подати заявку на різні посади на нашому сервері. Модератори, контент мейкери і т.п.
          \n <#1077347433002049596> список із покараннями які отримали гравці за порушення правил.
          \n## Спілкування
          \n <#983845556902322187> глобальний чат SurvivalBoom. Спілкуйтесь з іншими гравцями і не порушуйте правила!
          \n <#989102301828493362> усілякий крінж який не модерується. Якщо у вас срачка, можете відправити сюди свій крінж. Усі правила окрім правила про крінж все ще діють у цьому каналі.
          \n <#989118577573511180> спам-канал де можна відправляти команди для ботів.
          \n## Голосові канали
          \n <#1021498333950398585> трибуна у якій гравці SurvivalBoom збираються під час подій.
          \n <#984012535122505758> Публічний голосовий канал №1
          \n <#1110978692043251792> Публічний голосовий канал №2
          \n <#1007372049024569375> Публічний голосовий канал №3
          \n <#989820172602843156> Публічний канал для прослуховування музики. У цьому каналі не можна говорити.
          \n <#1060186127371341824> Канал де 24 на 7 грають різні українські радіостанції.
          \n <#983849250767134780> AFK канал.
          \n <#1013029769857744966> створити свій приватний голосовий канал."
        color: 0x41983

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

  # Налаштування модуля повідомлень користувачам про приєднання нового учасника, вихід учасника, буст сервера учасником.
  # Цей модуль буде відправляти повідомлення при заході/виході/бусті сервера учасником у спеціальні канали та в особисті повідомлення учасника.
  user-alerts-module:

    # Плейсхолдери:   (працюють у всіх повідомленнях)
    # - {{USERNAME}} - ім'я користувача (globalname, наприклад timurishche).
    # - {{DISPLAYNAME}} - відображуваний нік користувача (displayname, наприклад TIMURishche).
    # - {{USER-MENTION}} - згадування користувача (mention, наприклад <@572505632024952834>).
    # - {{GUILDNAME}} - назва дискорд сервера (наприклад SurvivalBoom).
    # - {{BOOST-LEVEL}} - рівень бустів дискорд сервера.
    # - {{BOOST-COUNT}} - кількість бустів дискорд сервера.

    # Дії при приєднанні учасника.
