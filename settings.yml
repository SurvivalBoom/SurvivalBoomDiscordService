  # Налаштування модуля статусу SurvivalBoomNetwork.
  # Модуль який перевіряє статус вказаних сервісів і виводить у спеціальний канал повідомлення зі статусом сервісів.
  network-status-module:

    status-channel-id: 1087370237629976687 # ID каналу куди буде відправлятись статус систем.

    message-update-interval: 10 # Час (у секундах) між оновленнями повідомлення зі статусом систем. Має бути не менше 10-ти секунд.

    status-update-interval: 15 # Час (у секундах) між оновленнями статусів систем. Має бути не менше 10-ти секунд.

    # Системи які буде моніторити дискорд бот.
    services:

      - name: Java_proxy # Назва сервісу. Назва довільна, але пишіть так щоб вам було зручно використовувати цю назву у плейсхолдерах нижче.
        type: JAVA_SERVER # Тип системи. Може бути JAVA_SERVER -> java сервер майнкрафт; BEDROCK_SERVER -> bedrock майнкрафт сервер.
        host: "mc.survivalboom.net" # ip майнкрафт серверу.

      - name: Auth
        type: JAVA_SERVER
        host: "162.55.83.203:25502"

      - name: Lobby
        type: JAVA_SERVER
        host: "162.55.83.203:25503"

      - name: Survival
        type: JAVA_SERVER
        host: "162.55.83.203:25504"

      - name: OneBlock
        type: JAVA_SERVER
        host: "162.55.83.203:25506"

      - name: Anarchy
        type: JAVA_SERVER
        host: "162.55.83.203:25505"

      - name: BedWars
        type: JAVA_SERVER
        host: "162.55.83.203:25507"

      - name: Tnt_Run
        type: JAVA_SERVER
        host: "162.55.83.203:25508"

      - name: EventServer
        type: JAVA_SERVER
        host: "162.55.83.203:25510"

      - name: BuilderServer
        type: JAVA_SERVER
        host: "162.55.83.203:25512"

      - name: Bedrock_proxy
        type: BEDROCK_SERVER
        host: "pe.survivalboom.net:25523"

      - name: DonateService
        type: SERVICE # SERVICE -> якийсь інший сервіс (Щоб бот зрозумів що сервіс онлайн, боту повинна надійти відповідь {"status": "OK"} при HTTP запиті на посилання вказане у полі host)
        host: "http://162.55.83.203:25513/status" # URL сервіса. Рекомендуємо зробити сторінку за адресою "https://вашдомен.ua/status", і щоб вона відповідала JSON текстом {"status": "OK"}

    # Embed повідомлення які буде надсилати бот.
    embeds:

      # Повідомлення при завантаженні даних статусу. Не змінюйте, інакше бот вас з'їсть.
      LOADING:
        title: ":satellite: SurvivalBoomStatus :satellite:"
        description: "<a:loading:1086970461549756536> Отримаємо дані про статус SurvivalBoom, зачекайте..."
        color: 0xfbff00
        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      # Головне embed повідомлення. Назву не змінюйте, інакше бот відправить вас далеко і надовго.
      MAIN:
        title: ":satellite: SurvivalBoomStatus :satellite:"
        description: ":bulb: Статус систем **SurvivalBoom Network**. \n :warning: Якщо щось не працює, динозаврик все зламав. \n \n:dvd: Останнє оновлення: {{LAST_UPDATE}} \n :bar_chart: **Загальний онлайн:** `{{GLOBAL$ONLINE}}`"
        thumbnail_url: "https://cdn.discordapp.com/attachments/983845556902322187/1078416436046860358/sb1lld_2.png"
        color: 41983
        fields:

          - title: "Java"
            value: "Статус: `{{Java_proxy$STATUS}}`\nОнлайн: `{{Java_proxy$ONLINE}}`"
            inline: true

          - title: "Bedrock"
            value: "Статус: `{{Bedrock_proxy$STATUS}}`\nОнлайн: `{{Bedrock_proxy$ONLINE}}`"
            inline: true

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

        buttons: # Кнопки які є на цьому embed'y.

          - name: "SurvivalBoomStatus_All" # Назва кнопки. (Унікальний ID кнопки, який буде використовуватись у коді бота)
            emoji: "📖" # Емодзі кнопки.
            text: "Детальний статус усіх систем SurvivalBoom" # Текст який буде на кнопці.
            style: SECONDARY # Стиль вигляду кнопки.
            row: 1 # Рядок на якому буде кнопка. Повинно бути не більше 5-и.
            send-embed: 'all_services' # Embed повідомлення яке буде відправлено користувачу який натиснув кнопку.

          - name: "SurvivalBoomStatus_Services"
            emoji: "📑"
            text: "Статус технічних систем SurvivalBoom"
            style: SECONDARY
            row: 1
            send-embed: 'services_status' # Embed повідомлення яке буде відправлено користувачу який натиснув кнопку.

      all_services:
        title: ":satellite: SurvivalBoomStatus :satellite:"
        description: ":bulb: Статус майнкрафт серверів та інших важливих сервісів.\n:warning: Якщо щось не працює, значить динозаврик знову щось зламав."
        thumbnail_url: "https://cdn.discordapp.com/attachments/983845556902322187/1078416436046860358/sb1lld_2.png"
        color: 41983
        fields:

          - title: ":satellite_orbital: Проксі-сервер :satellite_orbital:"
            value: "> Проксі-сервер майнкрафт серверу SurvivalBoom\n> **Статус:** `{{Java_proxy$STATUS}}`\n> **Онлайн:** `{{Java_proxy$ONLINE}}`"

          - title: ":airplane_small: Bedrock Проксі :airplane_small:"
            value: "> Bedrock Проксі-сервер майнкрафт серверу SurvivalBoom\n> **Статус:** `{{Bedrock_proxy$STATUS}}`\n> **Онлайн:** `{{Bedrock_proxy$ONLINE}}`"

          - title: ":lock: Сервер Авторизації :lock:"
            value: "> Майнкрафт сервер авторизації SurvivalBoom\n> **Статус:** `{{Auth$STATUS}}`\n> **Онлайн:** `{{Auth$ONLINE}}`"

          - title: ":hourglass: Майнкрафт Лоббі :hourglass:"
            value: "> Лоббі майнкрафт серверу SurvivalBoom\n> **Статус:** `{{Lobby$STATUS}}`\n> **Онлайн:** `{{Lobby$ONLINE}}`"

          - title: ":pick: Виживання :pick:"
            value: "> Режим Виживання на майнкрафт сервері SurvivalBoom\n> **Статус:** `{{Survival$STATUS}}`\n> **Онлайн:** `{{Survival$ONLINE}}`"

          - title: ":island: OneBlock :island:"
            value: "> Режим OneBlock на майнкрафт сервері SurvivalBoom\n> **Статус:** `{{OneBlock$STATUS}}`\n> **Онлайн:** `{{OneBlock$ONLINE}}`"

          - title: ":bed: BedWars :bed:"
            value: "> Режим BedWars на майнкрафт сервері SurvivalBoom\n> **Статус:** `{{BedWars$STATUS}}`\n> **Онлайн:** `{{BedWars$ONLINE}}`"

          - title: ":money_with_wings: DonateService :money_with_wings:"
            value: "> Сервіс автодонату SurvivalBoom\n> **Статус:** `{{DonateService$STATUS}}`\n\n:scissors: **Загальний онлайн на сервері: `{{GLOBAL$ONLINE}}`**"

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      services_status:
        title: ":satellite:  SurvivalBoomStatus :satellite:"
        description: ":radioactive: Статус технічних сервісів SurvivalBoomNetwork"
        thumbnail_url: "https://cdn.discordapp.com/attachments/983845556902322187/1078416436046860358/sb1lld_2.png"
        color: 41983
        fields:

          - title: "Discord Service"
            value: "Статус: `Працює`"
            inline: true

          - title: "Donate Service"
            value: "Статус: `{{DonateService$STATUS}}`"
            inline: true

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

    # Налаштування плейсхолдерів.
    placeholders-settings:

      # Налаштування тексту який буде видавати плейсхолдер {{СЕРВІС$STATUS}}
      status-placeholder-result:
        online: "Працює" # Якщо сервіс працює.
        offline: "Не Працює" # Якщо сервіс не працює.
        no-players: "Немає" # Заміна числа онлайну якщо сервіс не працює.

      # Список серверів онлайн яких буде сплюсовуватись і виводитись у плейсхолдері "{{GLOBAL$ONLINE}}"
      how-to-count-global-online:
        - Bedrock_proxy
        - Java_proxy

  # Налаштування модуля приватних голосовоих каналів.
  # Створює приватні голосові канали для кожного користувача.
  private-voices-module:

    create-voice-channel-id: 1013029769857744966 # ID каналу при заході у який учасником буде створено його особистий голосовий канал.

    backup-voice-channel-id: 984012535122505758 # ID каналу у який будуть переміщені користувачі якщо вони були кікнуті із приватного каналу.

    use-backup-channel: true # Використовувати бекап канал? Які ні, користувачі будуть відключені, а не перекинуті у бекап канал.

    auto-whitelist: true # Автоматично додавати під'єднаних учасників каналу у вайтліст коли натиснуто кнопку "заблокувати канал".

