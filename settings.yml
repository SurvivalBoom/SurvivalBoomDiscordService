# ВИ НЕ МОЖЕТЕ ВИКОРИСТОВУВАТИ БОТА НА ДЕКІЛЬКОХ ДИСК ОРД СЕРВЕРАХ!
#

# Налаштування головного дискорд бота.
main-discord-bot-settings:

  token: "" # Токен головного дискорд бота.

  # Налаштування дій при помилках дискорд бота.
  errors:

    # Відправлення повідомлень із помилками у спеціальний канал.
    send-to-debug-channel:

      enabled: true # Увімкнено?

      errors-channel-id: 1066158783614693406 # ID каналу куди будуть відправлятись помилки.

    # Відправляти помилку бота користувачу.
    # Якщо увімкнено, коли буде виникати помилка користувач побачить назву помилки, наприклад якщо виниклне помилка "list out of range",
    # користувачу буде надіслано повідомлення "Упсь! Виникла помилка: list out of range."
    # Якщо вимкнено, коли буде виникати помилка користувачу буде надіслано повідомлення "Упсь! Виникла невідома помилка!" без тексту помилки.
    send-error-details-to-user: true

    # Відправляти traceback помилки у консоль?
    # Якщо значення true, у консоль SurvivalBoom Discord Service буде відправлено traceback критичних внутрішних помилок бота.
    send-error-traceback-to-console: true

    # Embed повідомлення які помилок.
    # Не змінюйте назви embed повідомлень, інакше можете отримати дофігіще помилок.
    embeds:

      # Embed повідомлення яке буде відправлятись користувачу у відповідь якщо при виконанні його запиту виникла помилка.
      # (Конкретно це embed повідомлення буде використовуватись при значенні "send-error-details-to-user" = true)
      # Плейсхолдери: {ERROR} -> помилка.
      ERROR-TO-USER-WITH-DETAILS:
        title: ":satellite_orbital: SurvivalBoom :satellite_orbital:"
        description: ":radioactive: Упсь! При обробці вашого запиту виникла помилка! \n:t_rex: Схоже що динозаврик щось недописав.... \n:bell: Допоможіть SurvivalBoom стати кращим повідомивши у <#1077243862667509790> про цю помилку."
        color: 0xff0000
        fields:

          - title: "Помилка:"
            value: "`{{ERROR}}`"

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      # Embed повідомлення яке буде відправлятись користувачу у відповідь якщо при виконанні його запиту виникла помилка.
      # (Конкретно це embed повідомлення буде використовуватись при значенні "send-error-details-to-user" = false)
      ERROR-TO-USER-NO-DETAILS:
        title: ":satellite_orbital: SurvivalBoom :satellite_orbital:"
        description: ":radioactive: Упсь! При обробці вашого запиту виникла невідома помилка! \n:t_rex: Схоже що динозаврик щось недописав.... \n:bell: Допоможіть SurvivalBoom стати кращим повідомивши у <#1077243862667509790> про цю помилку."
        color: 0xff0000

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      # Embed повідомлення яке буде відправлятись у спеціальний канал при будь-якій помилці у SurvivalBoom Discord Service.
      # Плейсхолдери: {ERROR} -> помилка, {MODULE} -> назва модулю, {PLACE} -> у якому конкретному місці сталася помилка.
      ERROR-TO-DEBUG-CHANNEL:
        title: ":satellite_orbital: SurvivalBoom :satellite_orbital:"
        description: ":radioactive: Виникла помилка у **SurvivalBoom Discord Service**. \n:file_folder: Модуль: `{{MODULE}}`. \n:beginner: Де саме: `{{PLACE}}`."
        color: 0xff0000
        fields:

          - title: "Помилка:"
            value: "`{{ERROR}}`"

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

  # SurvivalBoom Discord Service потребує бази даних для роботи. У базі даних буде зберігатись уся інформація про користувачів і подібного...
  # Тут ви можете налаштувати базу даних.
  discord-service-database:

    database-host: "" # Посилання на базу даних.

    # Дані для підключення до бази даних.
    login-credentials:

      database-name: "" # Назва бази даних.
      username: "" # Користувач бази даних.
      password: "" # Пароль від користувача.

    # Назви таблиць у базі даних.
    table-settings:

      table-prefix: "sbds__" # Префікс який буде додаватись до назви таблиці.

      userdata-table-name: "userdata" # Назва таблиці із даними користувачів.

  # Налаштування логування.
  logging:

    # Увімкнути збереження усіх логів SurvivalBoomDiscordService у файл?
    enable-logs-saving: true

    # Час через який старі лог файли будуть видалені. Число вказується у днях.
    delete-saved-logs-after: 3

# Конфігурація модулів дискорд бота.
modules:

  # Налаштування музичного модуля.
  # Ну по назві думаю зрозуміло що робить цей модуль.
  music-module:

    # Налаштування сервісів які буде підтримувати SurvivalBoomMusic.
    youtube-support-enabled: true # Увімкнена підтримка youtube? Якщо ні, користувач не зможе програвати youtube та шукати пісні за ключовими словами.

    # Підтримка прямих посилань на файл. Це дуже зручна функція для програвання просто файлів, радіо, та багато чого іншого.
    # Але є нюанс. Щоб програти музику з прямого посилання на файл, бот підправляє HTTP запит на це посилання, щоб отримати аудіо файл.
    # Зловмисники можуть написати свій власний вебсервер (наприклад на python) і коли бот здійснить HTTP запит, зловмисники зможуть подивитись
    # з якої ip адреси було здійснено запит. Тим самим вони можуть дізнатись IP адресу машини на якій працює бот.
    direct-media-support-enabled: true

    # Для того, щоб музика працювала стабільно, SurvivalBoomMusic використовує LavaLink медіа сервер.
    # https://github.com/lavalink-devs/Lavalink
    # Впишіть нижче дані від вашого lavalink сервера.
    lavalink:
      host: "" # IP адреса сервера.
      port: 25524 # Порт сервера.
      password: "" # Пароль до медіа сервера.
    #
    # Цей параметр вiдповiдае за версию лавалiнку
    # new - 4.+
    # old - 3.+
    #
    version: new 

    # Налаштування підтримки Spotify.
    # Увага! Бот не грає музику зі Spotify напряму! Бот шукає музику на youtube по назві й автору Spotify Треку.
    # Для підтримки Spotify, підтримка YouTube повинна бути увімкнена.
    spotify:

      enabled: false # Увімкнено?

      # Токени для використовування API Spotify. Зареєструйтесь на сайті Spotify.
      spotify-api-client-id: "" # id клієнту Spotify API.
      spotify-api-client-secret: "" # Секретний токен Spotify API.

    # Чорний список каналів у яких музичний бот не буде працювати.
    channels-black-list:
      - 1060186127371341824
      - 1013029769857744966
      - 983849250767134780

    # Чорний список назв, посилань піснь.
    # Працює так: Користувач вписує у полі data команди /play посилання або пошуковий запит (нема різниці), якщо текст у data містить
    # щось із цього списку, користувачу буде виведена помилка.
    music-name-black-list:
      - "крінж"

    # Список ID ролей які будуть обходити чорний список пісень.
    music-name-black-list-bypass-roles:
      - 988782658337259562


    # Список музикальних ботів.
    # SurvivalBoom Discord Service підтримує технологію декільких музикальних ботів.
    # Це означає що буде використовуватись декілька музичних ботів на вашому дискорд сервері. Але ви повинні спочатку їх додати на ваш сервер.
    # Працює це так: Користувач виконує команду /play, головний бот починає шукати вільного музичного бота і підключає його до голосового каналу користувача.
    # Ви можете вказати скільки завгодно музичних ботів, і всі вони будуть паралельно працювати.
    music-bots:
      - name: SurvivalBoomMusic1 # Назва музичного бота.
        token: "" # Токен цього музичного бота.
      - name: SurvivalBoomMusic2
        token: ""
      - name: SurvivalBoomMusic3
        token: ""

    # Налаштування команд музичного модуля.
    commands:

      # Команда музичного бану. Ця команда дозволяє заблокувати користувача у музичному боті. Заблокований користувач не зможе використовувати музичного бота.
      ban-command:

        enabled: true # Чи увімкнена команда? Якщо ні, команда не буде працювати (логічно, так?)

        block-self-use: true # Заборонити користувачам використовувати цю команду на самому собі.

        block-stuff-use: true # Заборонити блокувати користувачів які мають доступ до цієї команди.

        # Список ролей який дозволено використовувати цю команду.
        # Тут потрібно вказувати ID ролей на вашому дискорд сервері.
        allowed-roles:
          - 988782658337259562
          - 1105854085103624242
          - 996031331563753574

      # Команда блокування музичного бота.
      # Ця команда забороняє використовувати поточного музичного бота усім, крім тих хто має доступ до команди блокування бота
      lock-command:

        enabled: true # Увімкнено?

        # ID ролей які зможуть використовувати цю команду і використовувати бота під час блокування.
        allowed-roles:
          - 988782658337259562

      # Команда увімкнення 24/7 режиму. Цей режим не дозволяє музичному боту покинути голосовий канал якщо у ньому нікого немає.
      24_7-mode-command:

        enabled: true

        allowed-roles:
          - 988782658337259562

    # Embed повідомлення музичного модуля. Ви можете їх змінити якщо вам не подобається дизайн, але не змінюйте назву інакше станете ще одною жертвою помилок SurvivalBoom Discord Service.
    embeds:

