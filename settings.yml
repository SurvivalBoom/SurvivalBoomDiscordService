          - title: "Тож... Хто ми такі?"
            value: "**SurvivalBoom** це один з найкращих українських майкрафт серверів. \nНаша мета стати тим самим замінником, а можливо і конкурентом, рашиських недо-серверів. \nГраючи в нас, ти підтримуєш українські сервери, і допомагаєш нам бути конкурентами руснявих серверів."
