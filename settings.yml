          - title: "Додаткова інформація"
            value: "Інструкція як почати грати, правила проекту та інша корисна інформація знаходяться у каналі <#983846821275271248>"
            inline: false

          - title: "Приємної вам гри!"
            value: "Інструкція як почати грати, правила проекту та інша корисна інформація знаходяться у каналі <#983846821275271248>"
            inline: false

        # Футер повідомлення.
        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      # Канали й повідомлення які будуть відправлені у них при приєднанні учасника.
      guild-messages:
        - channel-id: 989111157656797214
          message: "Користувач {{USER-MENTION}} приєднався до {{GUILDNAME}}."

