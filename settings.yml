  # Модуль генерації й переадресації посилання на дискорд сервер бота.
  # Генерує дискорд посилання у відповідь на всі HTTP запити.
  generate-discord-link-module:

    # Порт вебсервера модуля.
    web-server-port: 25586


  # Модуль сповіщень про DDoS атаки на ваш OVH сервер.
  # Підключається до API ovh і сповіщає вас якщо вказані сервери ддосять.
  ovh-ddos-alerts-module:

    # Налаштування даних для ovh api.
    ovh-api-credentials:
      endpoint: "ovh-ca"
      application-key: ""
      application-secret: ""
      consumer-key: ""

    # Інтервал з яким модуль буде перевіряти статус серверів. Вказується у секундах.
    check-interval: 10

    # ID ролей учасники яких отримають сповіщення про DDoS у особисті повідомлення.
    ddos-alert-roles-ids:
      - 988782658337259562

    embeds:

      DDOS_DETECTED:
        title: ":shield: SurvivalBoomProtect :shield:"
        description: ":bangbang: **Увага!** Виявлено DDoS атаку на сервер!"
        color: 0xff00d9
        fields:

          - title: "Сервер"
            value: "`{{SERVER}}`"
            inline: true

          - title: "IP"
            value: "||{{ADDRESS}}||"
            inline: true

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

      DDOS_END:
        title: ":shield: SurvivalBoomProtect :shield:"
        description: ":dragon_face: DDoS атаку на сервер припинено."
        color: 0x00ffc3
        fields:

          - title: "Сервер"
            value: "`{{SERVER}}`"
            inline: true

          - title: "IP"
            value: "||{{ADDRESS}}||"
            inline: true

        footer:
          text: "SurvivalBoomNetwork 2024 | SurvivalBoom Discord Service"
          icon_url: "https://cdn.discordapp.com/attachments/989118577573511180/1086802085594533928/5d20db24052f7bb86af58292c295710a.png"

    # Сервера які буде перевіряти модуль.
    servers:

      - name: "Proxy" # Назва сервера. Буде відображатись в повідомленнях.
        address: "127.0.0.1" # IP адреса сервера.

      - name: "Backend"
        address: "127.0.0.2"

